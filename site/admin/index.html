<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tsuzuki — correction queue</title>
<!-- Maintainer tool. Not linked from anywhere, excluded in robots.txt, and
     useless without the secret — but keep it out of the index regardless. -->
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="referrer" content="no-referrer" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#e6edf3;font:14px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
a{color:#22d3ee}
.wrap{max-width:1040px;margin:0 auto;padding:22px 18px 70px}
h1{font-size:22px;margin:0 0 4px;display:flex;align-items:center;gap:9px}
h1 .dot{width:12px;height:12px;border-radius:50%;background:conic-gradient(from 0deg,#8b5cf6,#22d3ee,#f59e0b,#8b5cf6)}
.sub{color:#8b97a7;font-size:13px;margin:0 0 18px}
button,input,select,textarea{font:inherit}
button{background:#1c2230;border:1px solid #2a3140;color:#e6edf3;border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:#8b5cf6}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-color:transparent;font-weight:700}
button.danger{border-color:#7f1d1d;color:#fca5a5}
input,select,textarea{background:#12171f;border:1px solid #2a3140;color:#e6edf3;border-radius:8px;padding:7px 10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#8b5cf6}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px;
  background:#161b22;border:1px solid #2a3140;border-radius:12px;padding:12px 14px}
.bar .grow{flex:1;min-width:170px}
.tabs{display:flex;gap:7px;margin-bottom:14px}
.tabs button.on{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-color:transparent;font-weight:700}
.card{background:#161b22;border:1px solid #2a3140;border-radius:12px;padding:13px 15px;margin-bottom:12px}
.card.applied{opacity:.55}
.card h3{margin:0 0 3px;font-size:15px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.pill{font-size:10.5px;padding:2px 8px;border-radius:20px;background:#1c2230;border:1px solid #2a3140;color:#8b97a7}
.pill.k{border-color:#8b5cf6;color:#c4b5fd}
.pill.air{border-color:#22d3ee;color:#22d3ee;font-weight:700}
.pill.st-open{border-color:#f59e0b;color:#fcd34d}
.pill.st-applied{border-color:#22c55e;color:#86efac}
.pill.st-rejected,.pill.st-duplicate{border-color:#7f1d1d;color:#fca5a5}
.detail{background:#12171f;border-left:3px solid #8b5cf6;border-radius:0 8px 8px 0;padding:9px 12px;margin:8px 0;white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
.row label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:#8b97a7}
.row label input,.row label select{min-width:120px}
.hint{color:#8b97a7;font-size:12px}
.empty{color:#8b97a7;text-align:center;padding:40px 0}
.err{color:#fca5a5}
.ok{color:#86efac}
pre{background:#12171f;border:1px solid #2a3140;border-radius:10px;padding:12px;overflow:auto;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:60vh}
textarea.json{width:100%;min-height:340px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.gate{max-width:420px;margin:12vh auto;background:#161b22;border:1px solid #2a3140;border-radius:14px;padding:22px}
.gate h1{margin-bottom:10px}
/* themes + grants */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px;margin-bottom:14px}
.tcard{background:#161b22;border:1px solid #2a3140;border-radius:12px;padding:11px 12px}
.tcard.sel{border-color:#8b5cf6}
.tcard h4{margin:0 0 3px;font-size:13.5px;display:flex;align-items:center;gap:7px}
.tcard .dot2{width:12px;height:12px;border-radius:50%;flex:none}
.tcard .sub2{color:#8b97a7;font-size:11.5px;margin-bottom:7px}
.swatchrow{display:flex;gap:3px;margin-bottom:8px}
.swatchrow span{width:15px;height:15px;border-radius:3px;border:1px solid rgba(255,255,255,.08)}
.tcard .art{height:52px;border-radius:7px;background:#0d1117 center/cover no-repeat;margin-bottom:7px}
.tcard .no-art{display:flex;align-items:center;justify-content:center;color:#5c6675;font-size:11px}
.grow2{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
table.g{width:100%;border-collapse:collapse;font-size:13px}
table.g th{text-align:left;color:#8b97a7;font-size:11.5px;font-weight:700;padding:5px 8px;border-bottom:1px solid #2a3140}
table.g td{padding:7px 8px;border-bottom:1px solid #1c2230;vertical-align:middle}
table.g tr:hover td{background:#12171f}
table.g img{border-radius:50%;vertical-align:middle;margin-right:7px}
code.id{font:11.5px ui-monospace,Menlo,monospace;color:#8b97a7}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
"use strict";
/* Maintainer console for the correction layer.
   Reads /api/report and writes /api/overrides. The secret lives in
   sessionStorage only — it dies with the tab, and is never put in the URL,
   because a URL leaks through history, bookmarks and Referer headers. */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SECRET_KEY="tsuzuki.admin.secret";
const PREVIEW_KEY="anical.previewSkin";   // read by site/index.html to try a skin on
let secret=sessionStorage.getItem(SECRET_KEY)||"";
let tab="open", reports=[], overrides={shows:{}}, busy=false;
let themes={}, grants=[], dirUsers=[], loadError="";

const hdr=()=>({"Content-Type":"application/json","x-tsuzuki-secret":secret});
async function api(path,opts){
  const res=await fetch(path,{...opts,headers:{...hdr(),...(opts&&opts.headers||{})}});
  if(res.status===403){ throw new Error("Wrong secret, or ADMIN_SECRET isn't set on the site."); }
  const j=await res.json().catch(()=>({}));
  if(!res.ok||j.ok===false) throw new Error(j.error||("HTTP "+res.status));
  return j;
}

/* ---------- gate ---------- */
function renderGate(msg){
  $("app").innerHTML=`<div class="gate">
    <h1><span class="dot"></span> Correction queue</h1>
    <p class="sub">Maintainers only. Paste the site's <code>ADMIN_SECRET</code>.</p>
    <div class="row"><label style="flex:1">Secret<input type="password" id="sec" autocomplete="off"></label>
      <button class="primary" id="go">Unlock</button></div>
    ${msg?`<p class="err" style="margin-bottom:0">${esc(msg)}</p>`:""}
  </div>`;
  const submit=()=>{ secret=$("sec").value.trim(); if(!secret) return;
    sessionStorage.setItem(SECRET_KEY,secret); boot(); };
  $("go").onclick=submit;
  $("sec").onkeydown=e=>{ if(e.key==="Enter") submit(); };
  $("sec").focus();
}

/* ---------- shell ---------- */
function renderShell(){
  const openN=reports.filter(r=>(r.status||"open")==="open").length;
  $("app").innerHTML=`
    <h1><span class="dot"></span> Tsuzuki console</h1>
    <p class="sub">Corrections and skins. Everything here writes to a live store, so it reaches every visitor
      within minutes and costs no deploy.</p>
    <div class="bar">
      <button id="reload">↻ Reload</button>
      <span class="hint grow ${loadError?"err":""}" id="status">${loadError?esc("Some data didn't load: "+loadError):`${openN} open report${openN===1?"":"s"} · ${Object.keys(themes).length} skins · ${grants.length} granted`}</span>
      <button id="lock">Lock</button>
    </div>
    <div class="tabs">
      <button data-tab="open" class="${tab==="open"?"on":""}">Open (${openN})</button>
      <button data-tab="all" class="${tab==="all"?"on":""}">All reports</button>
      <button data-tab="raw" class="${tab==="raw"?"on":""}">Raw overrides</button>
      <button data-tab="skins" class="${tab==="skins"?"on":""}">Skins (${Object.keys(themes).length})</button>
      <button data-tab="grants" class="${tab==="grants"?"on":""}">Grants (${grants.length})</button>
    </div>
    <div id="body"></div>`;
  $("reload").onclick=boot;
  $("lock").onclick=()=>{ sessionStorage.removeItem(SECRET_KEY); secret=""; renderGate(""); };
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; renderShell(); });
  if(tab==="raw") renderRaw();
  else if(tab==="skins") renderSkins();
  else if(tab==="grants") renderGrants();
  else renderReports();
}

/* ---------- reports ---------- */
const AIRS=["sub","dub","raw"];
function ovFor(id){ return (overrides.shows&&overrides.shows[String(id)])||null; }

function renderReports(){
  const list=reports.filter(r=>tab==="all"||(r.status||"open")==="open");
  if(!list.length){ $("body").innerHTML=`<div class="empty">Nothing here. ${tab==="open"?"Queue is clear.":"No reports yet."}</div>`; return; }
  $("body").innerHTML=list.map(cardHTML).join("");
  list.forEach(r=>wireCard(r));
}

function cardHTML(r){
  const st=r.status||"open";
  const ov=ovFor(r.mediaId);
  const when=r.createdAt?new Date(r.createdAt).toLocaleString():"";
  return `<div class="card ${st!=="open"?"applied":""}" id="c-${esc(r.key)}">
    <h3>${esc(r.title||("Media "+r.mediaId))}
      <a href="/?show=${esc(r.mediaId)}" target="_blank" rel="noopener" style="font-size:12px;font-weight:400">open →</a>
      <a href="https://anilist.co/anime/${esc(r.mediaId)}" target="_blank" rel="noopener" style="font-size:12px;font-weight:400">AniList →</a></h3>
    <div class="meta">
      <span class="pill st-${esc(st)}">${esc(st.toUpperCase())}</span>
      <span class="pill k">${esc(r.kind||"other")}</span>
      ${r.episode?`<span class="pill">Ep ${esc(r.episode)}</span>`:""}
      ${r.airType?`<span class="pill air">${esc(r.airType.toUpperCase())}</span>`:""}
      ${r.platform?`<span class="pill">${esc(r.platform)}</span>`:""}
      <span class="pill">id ${esc(r.mediaId)}</span>
      <span class="pill">${esc(when)}</span>
      <span class="pill">from ${esc(r.reporter||"?")}</span>
      ${ov?`<span class="pill k">has overrides</span>`:""}
    </div>
    ${r.expected?`<div class="hint">Reporter says the correct time is: <b>${esc(r.expected)}</b></div>`:""}
    <div class="detail">${esc(r.detail||"")}</div>
    ${r.source?`<div class="hint">Source: <a href="${esc(r.source)}" target="_blank" rel="noopener noreferrer">${esc(r.source)}</a></div>`:""}
    ${r.maintainerNote?`<div class="hint">Note: ${esc(r.maintainerNote)}</div>`:""}

    <div class="row">
      <label>Fix<select data-f="mode">
        <option value="exact">Exact time for this episode</option>
        <option value="delay">Delay this episode</option>
        <option value="break">Break — no episode</option>
        <option value="rule">Show-wide offset rule</option>
      </select></label>
      <label>Release<select data-f="air">${AIRS.map(a=>`<option value="${a}"${a===(r.airType||"sub")?" selected":""}>${a.toUpperCase()}</option>`).join("")}</select></label>
      <label>Episode<input type="number" data-f="ep" value="${esc(r.episode||1)}" min="0" style="width:80px"></label>
      <label data-when="exact">New local time<input type="datetime-local" data-f="dt"></label>
      <label data-when="delay">Shift by<select data-f="shift">
        <option value="60">1 hour</option><option value="1440">1 day</option>
        <option value="10080" selected>1 week</option><option value="20160">2 weeks</option></select></label>
      <label data-when="rule">Offset (min)<input type="number" data-f="off" placeholder="e.g. 60" style="width:110px"></label>
      <label data-when="rule">From episode<input type="number" data-f="from" min="1" placeholder="1" style="width:100px"></label>
      <label data-when="rule exact">Platform<input type="text" data-f="plat" value="${esc(r.platform||"")}" placeholder="Crunchyroll" style="width:130px"></label>
      <label data-when="delay break" class="grow">Reason<input type="text" data-f="reason" placeholder="Pre-empted by…" style="width:100%"></label>
    </div>
    <div class="row">
      <button class="primary" data-a="apply">✓ Apply &amp; close</button>
      <button data-a="preview">Preview patch</button>
      <button data-a="reject">Reject</button>
      <button data-a="dupe">Duplicate</button>
      <button class="danger" data-a="delete">Delete</button>
      <span class="hint" data-a="msg"></span>
    </div>
    <pre data-a="patch" style="display:none"></pre>
  </div>`;
}

// Build the override patch this card's form describes. Returns null with a
// message when the form isn't answerable yet, so Apply can't write a
// half-specified correction.
function buildPatch(root, r){
  const v=f=>{ const el=root.querySelector(`[data-f="${f}"]`); return el?el.value.trim():""; };
  const mode=v("mode"), air=v("air"), ep=String(parseInt(v("ep"),10)||0);
  const id=String(r.mediaId);
  const plat=v("plat")||undefined;
  if(mode==="rule"){
    const off=parseInt(v("off"),10);
    if(!Number.isFinite(off)) return {err:"Enter an offset in minutes."};
    if(air==="raw") return {err:"A show-wide rule only makes sense for sub or dub."};
    const rule={offsetMin:off};
    if(plat) rule.platform=plat;
    const from=parseInt(v("from"),10); if(from>0) rule.fromEpisode=from;
    return {patch:{shows:{[id]:{[air]:rule}}}};
  }
  if(!ep) return {err:"Which episode?"};
  if(mode==="break"){
    return {patch:{shows:{[id]:{episodes:{[ep]:{status:{kind:"break",reason:v("reason")||"Broadcast break — no episode"}}}}}}};
  }
  if(mode==="delay"){
    const shift=parseInt(v("shift"),10)||0;
    if(!shift) return {err:"Pick how far to shift it."};
    return {patch:{shows:{[id]:{episodes:{[ep]:{status:{kind:"delay",shiftMin:shift,reason:v("reason")||"Delayed",
      source:r.source||undefined}}}}}}};
  }
  const dt=v("dt");
  if(!dt) return {err:"Pick the corrected time."};
  const ts=Math.floor(new Date(dt).getTime()/1000);
  if(!Number.isFinite(ts)) return {err:"That date didn't parse."};
  const entry={airingAt:ts};
  if(plat&&air!=="raw") entry.platform=plat;
  return {patch:{shows:{[id]:{episodes:{[ep]:{[air]:entry}}}}}};
}

function wireCard(r){
  const root=$("c-"+r.key); if(!root) return;
  const msg=root.querySelector('[data-a="msg"]');
  const modeSel=root.querySelector('[data-f="mode"]');
  const syncFields=()=>{
    const m=modeSel.value;
    root.querySelectorAll("[data-when]").forEach(el=>{
      el.style.display=el.dataset.when.split(" ").includes(m)?"":"none";
    });
  };
  modeSel.onchange=syncFields; syncFields();

  // Seed the datetime picker from the episode's current time so a maintainer
  // adjusts a real value instead of typing one from scratch.
  const dtEl=root.querySelector('[data-f="dt"]');
  const epEl=root.querySelector('[data-f="ep"]');
  const airEl=root.querySelector('[data-f="air"]');
  const seedTime=async()=>{
    try{
      const j=await (await fetch(`/api/v1/anime/${encodeURIComponent(r.mediaId)}`)).json();
      const want=+epEl.value, air=airEl.value;
      const hit=(j.episodes||[]).find(e=>e.episode===want&&e.airType===air&&e.airingAt);
      if(hit){ const d=new Date(hit.airingAt*1000);
        dtEl.value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
        msg.textContent=`Currently ${d.toLocaleString()} (${air.toUpperCase()})`;
      } else msg.textContent="No current time for that episode/release.";
    }catch(e){ msg.textContent=""; }
  };
  epEl.onchange=seedTime; airEl.onchange=seedTime; seedTime();

  const setStatus=async(status)=>{
    if(busy) return; busy=true;
    try{ await api("/api/report",{method:"POST",body:JSON.stringify({key:r.key,status})}); await boot(); }
    catch(e){ msg.textContent=e.message; msg.className="hint err"; }
    finally{ busy=false; }
  };

  root.querySelector('[data-a="preview"]').onclick=()=>{
    const {patch,err}=buildPatch(root,r);
    const pre=root.querySelector('[data-a="patch"]');
    pre.style.display=""; pre.textContent=err?("⚠ "+err):JSON.stringify(patch,null,2);
  };
  root.querySelector('[data-a="apply"]').onclick=async()=>{
    const {patch,err}=buildPatch(root,r);
    if(err){ msg.textContent="⚠ "+err; msg.className="hint err"; return; }
    if(busy) return; busy=true;
    msg.textContent="Applying…"; msg.className="hint";
    try{
      await api("/api/overrides",{method:"POST",body:JSON.stringify(patch)});   // merge mode
      await api("/api/report",{method:"POST",body:JSON.stringify({key:r.key,status:"applied"})});
      await boot();
    }catch(e){ msg.textContent=e.message; msg.className="hint err"; }
    finally{ busy=false; }
  };
  root.querySelector('[data-a="reject"]').onclick=()=>setStatus("rejected");
  root.querySelector('[data-a="dupe"]').onclick=()=>setStatus("duplicate");
  root.querySelector('[data-a="delete"]').onclick=async()=>{
    if(!confirm("Delete this report permanently?")) return;
    if(busy) return; busy=true;
    try{ await api("/api/report",{method:"POST",body:JSON.stringify({key:r.key,action:"delete"})}); await boot(); }
    catch(e){ msg.textContent=e.message; msg.className="hint err"; }
    finally{ busy=false; }
  };
}

/* ---------- raw editor ---------- */
function renderRaw(){
  $("body").innerHTML=`
    <p class="hint">The whole live override document. Editing here <b>replaces</b> it — for one-off fixes use the
      queue instead. The committed seed at <a href="/data/overrides.json" target="_blank">/data/overrides.json</a>
      is merged underneath this at read time.</p>
    <textarea class="json" id="rawJson">${esc(JSON.stringify(overrides,null,2))}</textarea>
    <div class="row"><button class="primary" id="rawSave">Save (replace)</button>
      <button id="rawReload">Discard changes</button><span class="hint" id="rawMsg"></span></div>`;
  $("rawReload").onclick=boot;
  $("rawSave").onclick=async()=>{
    const m=$("rawMsg");
    let doc; try{ doc=JSON.parse($("rawJson").value); }catch(e){ m.textContent="Invalid JSON: "+e.message; m.className="hint err"; return; }
    if(!confirm("Replace the entire live override document?")) return;
    m.textContent="Saving…"; m.className="hint";
    try{ const j=await api("/api/overrides?mode=replace",{method:"POST",body:JSON.stringify(doc)});
      m.textContent=`Saved — ${j.shows} shows.`; m.className="hint ok"; await boot(); }
    catch(e){ m.textContent=e.message; m.className="hint err"; }
  };
}

/* ---------- skins ----------
   A skin is a full site theme tied to a character or a series: the whole colour
   palette plus up to four image layers (page backdrop, header band, corner
   cutout, empty-state watermark). Images are external https URLs — the shipped
   set points at AniList's CDN, which the site already loads every cover from —
   so a skin is pure JSON and adding one costs no deploy and no upload.

   The editor is deliberately the raw document, same as Raw overrides: the
   schema is small, and a form would be a worse version of a text editor with
   the field list right there in front of you. Preview renders it on the real
   site rather than in a swatch, because the whole point of a skin is what the
   calendar looks like wearing it. */
const THEME_TEMPLATE={
  id:"my-skin", name:"My Skin", series:"Series name", mode:"dark",
  // All thirteen are required — a partial palette leaves half the UI on the
  // default purple, which reads as a bug rather than a theme.
  colors:{bg:"#0d0b11",bg2:"#141019",bg3:"#1c1726",line:"#2e2740",txt:"#ece9f3",muted:"#9b93ad",
    accent:"#a78bfa",accent2:"#67e8f9",premiere:"#f5a524",today:"#7c5cf0",good:"#4ade80",now:"#fb7185",finale:"#f05252"},
  glow:"#a78bfa",
  // Display face, headings only. Any Google Fonts stylesheet URL.
  font:{family:'"Bebas Neue",Impact,sans-serif',css:"https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap",scale:1.2},
  // radius 0-28, chipRadius 0-30, border 1-3, cardBlur 0-24. This is what makes
  // a skin feel like a different product rather than a re-tint.
  shape:{radius:12,chipRadius:20,border:1,cardBlur:10},
  // All 0-1.
  effects:{vignette:0.3,grain:0,scanlines:0,glowStrength:0.5},
  backdrop:{url:"https://…",opacity:0.34,blur:4,position:"center 20%"},
  header:{url:"https://…",opacity:0.62,position:"center 38%"},
  // fade dissolves the edges into the page — without it a poster in the corner
  // reads as a screenshot pasted on top.
  cutout:{url:"https://…",corner:"bottom-right",width:380,opacity:0.5,offsetX:-8,offsetY:-8,fade:0.62,flip:false},
  watermark:{url:"https://…",opacity:0.08},
  // pattern and ornament also accept data:image/svg+xml URIs — that's how the
  // generated set ships its textures, so they can't 404.
  pattern:{url:"https://…",opacity:0.07,size:160},
  ornament:{url:"https://…",corner:"top-left",width:260,opacity:0.35,offsetX:0,offsetY:0},
};

function skinCardHTML(id,t){
  const c=t.colors||{};
  const art=(t.backdrop&&t.backdrop.url)||(t.header&&t.header.url)||(t.watermark&&t.watermark.url)||"";
  const granted=grants.filter(g=>g.themeId===id).length;
  return `<div class="tcard">
    <div class="art ${art?"":"no-art"}" ${art?`style="background-image:url('${esc(art)}')"`:""}>${art?"":"no art"}</div>
    <h4><span class="dot2" style="background:linear-gradient(135deg,${esc(c.accent||"#888")},${esc(c.accent2||"#888")})"></span>${esc(t.name||id)}</h4>
    <div class="sub2"><code class="id">${esc(id)}</code>${granted?` · ${granted} granted`:""}</div>
    <div class="sub2">${esc(((t.font&&t.font.family)||"system").replace(/^"|",.*$/g,""))} · r${(t.shape&&t.shape.radius)??12} · ${["backdrop","header","cutout","pattern","ornament","watermark"].filter(k=>t[k]&&t[k].url).length} layers</div>
    <div class="swatchrow">${["bg","bg2","accent","accent2","premiere","now"].map(k=>`<span title="${k}: ${esc(c[k]||"")}" style="background:${esc(c[k]||"#000")}"></span>`).join("")}</div>
    <div class="grow2">
      <button data-preview="${esc(id)}">👁 Preview</button>
      <button data-edit="${esc(id)}">Edit</button>
    </div>
  </div>`;
}

function renderSkins(){
  const ids=Object.keys(themes).sort();
  $("body").innerHTML=`
    <p class="hint">Skins are granted to individual accounts in the <b>Grants</b> tab. The set below is the committed
      seed (<code>site/data/themes.json</code>, generated by <code>scripts/build-themes.mjs</code>) with anything saved
      here merged on top. Saving replaces a whole theme by id — a partial palette would leave half the UI on the
      default purple.</p>
    ${ids.length?`<div class="tgrid">${ids.map(id=>skinCardHTML(id,themes[id])).join("")}</div>`:`<div class="empty">No skins yet.</div>`}
    <div class="row"><button id="skNew">+ New skin from template</button>
      <span class="hint">Preview opens the real site wearing it. Nobody else sees a preview.</span></div>
    <textarea class="json" id="skJson" placeholder="Pick Edit or New — the theme document shows up here."></textarea>
    <div class="row"><button class="primary" id="skSave">Save skin</button>
      <button id="skReload">Discard changes</button><span class="hint" id="skMsg"></span></div>`;

  $("skReload").onclick=boot;
  $("skNew").onclick=()=>{ $("skJson").value=JSON.stringify(THEME_TEMPLATE,null,2); $("skJson").focus(); };
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.edit;
    $("skJson").value=JSON.stringify({id, ...themes[id]},null,2);
    $("skJson").scrollIntoView({behavior:"smooth",block:"center"});
  });
  document.querySelectorAll("[data-preview]").forEach(b=>b.onclick=()=>{
    // Handed over in localStorage, not a URL parameter: a ?theme= link would let
    // anyone wear an event skin, and exclusivity is the whole product here.
    localStorage.setItem(PREVIEW_KEY, b.dataset.preview);
    window.open("/","_blank","noopener");
  });
  $("skSave").onclick=async()=>{
    const m=$("skMsg");
    let doc;
    try{ doc=JSON.parse($("skJson").value); }catch(e){ m.textContent="Invalid JSON: "+e.message; m.className="hint err"; return; }
    const id=String(doc.id||"").trim();
    if(!id){ m.textContent='Needs an "id" (lowercase letters, digits, dashes).'; m.className="hint err"; return; }
    const {id:_drop, ...theme}=doc;
    m.textContent="Saving…"; m.className="hint";
    try{
      const j=await api("/api/themes",{method:"POST",body:JSON.stringify({themes:{[id]:theme}})});
      m.textContent=`Saved — ${j.themes} skins live.`; m.className="hint ok";
      await boot();
    }catch(e){ m.textContent=e.message; m.className="hint err"; }
  };
}

/* ---------- grants ----------
   Who wears what. Permanent: no expiry and nothing the client re-checks for a
   lapse. Remove exists to undo a mistyped id and to honour a request to be
   forgotten — it drops the stored directory row too. */
function renderGrants(){
  const opts=Object.keys(themes).sort().map(id=>`<option value="${esc(id)}">${esc(themes[id].name||id)}</option>`).join("");
  const seen=new Set(grants.map(g=>g.discordId));
  const ungranted=dirUsers.filter(u=>!seen.has(u.id));
  const who=u=>{
    if(!u) return `<span class="hint">hasn't signed in yet</span>`;
    const av=u.avatar?`https://cdn.discordapp.com/avatars/${encodeURIComponent(u.id)}/${encodeURIComponent(u.avatar)}.png?size=32`:"";
    return `${av?`<img src="${esc(av)}" alt="" width="22" height="22">`:""}${esc(u.globalName||u.username||u.id)}`;
  };
  $("body").innerHTML=`
    <p class="hint">A grant is permanent — there's no expiry and the wearer can only turn it off for themselves.
      To find someone's id: Discord → Settings → Advanced → Developer Mode, then right-click them → Copy User ID.
      They can also just sign in once and appear in the list below.</p>
    <div class="bar">
      <label class="hint">Discord user id <input id="gId" placeholder="e.g. 216783729166680001" style="width:210px" inputmode="numeric"></label>
      <label class="hint">Skin <select id="gTheme">${opts}</select></label>
      <label class="hint grow">Note <input id="gNote" placeholder="why (optional)" style="width:100%"></label>
      <button class="primary" id="gAdd">Grant</button>
    </div>
    <span class="hint" id="gMsg"></span>
    ${grants.length?`<table class="g"><tr><th>Who</th><th>Skin</th><th>Granted</th><th>Note</th><th></th></tr>
      ${grants.map(g=>`<tr>
        <td>${who(g.user)}<br><code class="id">${esc(g.discordId)}</code></td>
        <td>${esc((themes[g.themeId]&&themes[g.themeId].name)||g.themeId)}${themes[g.themeId]?"":' <span class="err">(missing!)</span>'}</td>
        <td class="hint">${g.grantedAt?esc(new Date(g.grantedAt).toLocaleDateString()):""}</td>
        <td class="hint">${esc(g.note||"")}</td>
        <td><button class="danger" data-revoke="${esc(g.discordId)}">Remove</button></td>
      </tr>`).join("")}</table>`:`<div class="empty">Nothing granted yet.</div>`}
    ${ungranted.length?`<h3 style="font-size:14px;margin:20px 0 6px">Signed in, no skin (${ungranted.length})</h3>
      <table class="g">${ungranted.slice(0,60).map(u=>`<tr>
        <td>${who(u)}<br><code class="id">${esc(u.id)}</code></td>
        <td class="hint">last seen ${u.lastSeen?esc(new Date(u.lastSeen).toLocaleDateString()):"?"}</td>
        <td style="text-align:right"><button data-pick="${esc(u.id)}">Use this id</button></td>
      </tr>`).join("")}</table>`:""}`;

  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    $("gId").value=b.dataset.pick;
    $("gId").scrollIntoView({behavior:"smooth",block:"center"});
  });
  $("gAdd").onclick=async()=>{
    const m=$("gMsg");
    const discordId=$("gId").value.trim();
    if(!/^\d{17,20}$/.test(discordId)){ m.textContent="That isn't a Discord user id (17–20 digits)."; m.className="hint err"; return; }
    if(busy) return; busy=true;
    m.textContent="Granting…"; m.className="hint";
    try{
      await api("/api/grants",{method:"POST",body:JSON.stringify({discordId, themeId:$("gTheme").value, note:$("gNote").value.trim()})});
      await boot();
    }catch(e){ m.textContent=e.message; m.className="hint err"; }
    finally{ busy=false; }
  };
  document.querySelectorAll("[data-revoke]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Remove this grant? Their stored Discord name and avatar go too.")) return;
    if(busy) return; busy=true;
    try{ await api("/api/grants",{method:"POST",body:JSON.stringify({discordId:b.dataset.revoke, action:"remove"})}); await boot(); }
    catch(e){ const m=$("gMsg"); m.textContent=e.message; m.className="hint err"; }
    finally{ busy=false; }
  });
}

/* ---------- boot ---------- */
async function boot(){
  if(!secret) return renderGate("");
  // One probe decides whether the secret is right; everything after it is
  // allowed to fail on its own. A console that refuses to open because the
  // report store hiccuped would also take the skins and grants down with it,
  // and those have nothing to do with each other.
  try{ const rep=await api("/api/report?status=all"); reports=rep.reports||[]; }
  catch(e){
    if(/403|secret/i.test(e.message)) return renderGate(e.message);
    reports=[]; loadError=e.message;
  }
  const [ov,th,gr]=await Promise.all([
    fetch("/api/overrides").then(r=>r.json()).catch(()=>null),
    fetch("/api/themes").then(r=>r.json()).catch(()=>null),
    api("/api/grants").catch(()=>null),
  ]);
  overrides={version:(ov&&ov.version)||1, updatedAt:(ov&&ov.updatedAt)||null, shows:(ov&&ov.shows)||{}};
  themes=(th&&th.themes)||{};
  grants=(gr&&gr.grants)||[];
  dirUsers=(gr&&gr.users)||[];
  renderShell();
}
boot();
</script>
