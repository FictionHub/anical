<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Tsuzuki</title>
  <!-- つ — the first character of つづく, "to be continued", which is what the
       name means. Drawn as a path rather than text so it never depends on a
       Japanese font being installed.

       The glyph's inked box is 49.07 x 36.66 centred on (31.53, 34.41), not on
       the middle of the viewBox, so the transform both scales it into the tile
       and corrects that offset: tx = 32 + 0.47s, ty = 32 - 2.41s. -->
  <rect width="64" height="64" rx="15" fill="#ff4a2e"/>
  <g transform="translate(32.4 30) scale(.84) translate(-32 -32)">
    <path d="M11 23 C26 18.5 42 19.5 48 24 C54.5 29 53 38 45 44 C37 49.5 25 50.5 15 45.5"
          fill="none" stroke="#12060a" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
