# The website lives in /site and is served as PURE STATIC files — there is no
# build step. That makes deploys FAST, but NOT free: every deploy costs ~15
# Netlify credits regardless of whether a build command runs. At 300 credits/
# month on the free tier that is a hard ceiling of ~20 deploys/month, shared
# between content refreshes, feature ships and hotfixes. Deploys are billed per
# PUSH, not per commit — so batching several commits into one push is the
# cheapest way to ship.
#
# The SEO landing pages (/today/, /<season>-<year>/) and sitemap.xml are
# generated and committed by GitHub Actions (.github/workflows/refresh-pages.yml,
# which runs scripts/build-seo.mjs on GitHub's free minutes). Netlify just
# uploads whatever is in /site.
[build]
  publish = "site"
  # Skip the deploy entirely when a push didn't touch /site — docs, workflow
  # edits and bot scripts change nothing users can see, so they shouldn't cost
  # a deploy. Netlify cancels the build when this command exits 0, and
  # `git diff --quiet` exits 0 precisely when /site is unchanged.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site"

[functions]
  directory = "netlify/functions"

# Friendly aliases for the Web Push API used by site/index.html.
[[redirects]]
  from = "/api/push/subscribe"
  to = "/.netlify/functions/push-subscribe"
  status = 200

[[redirects]]
  from = "/api/push/unsubscribe"
  to = "/.netlify/functions/push-unsubscribe"
  status = 200

# Read-only status for the ingestion backbone's scheduled worker (ingest.mjs).
[[redirects]]
  from = "/api/ingest/status"
  to = "/.netlify/functions/ingest-status"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Subscribable calendar feeds must be served as text/calendar (nosniff is on,
# so the Content-Type has to be correct for calendar apps to accept them).
[[headers]]
  for = "/feeds/*"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Cache-Control = "public, max-age=3600"
