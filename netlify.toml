# The website lives in /site and is served as PURE STATIC files — there is no
# build step. That makes deploys FAST, but NOT free: every deploy costs ~15
# Netlify credits regardless of whether a build command runs. At 300 credits/
# month on the free tier that is a hard ceiling of ~20 deploys/month, shared
# between content refreshes, feature ships and hotfixes. Deploys are billed per
# PUSH, not per commit — so batching several commits into one push is the
# cheapest way to ship.
#
# The SEO landing pages (/today/, /<season>-<year>/) and sitemap.xml are
# generated and committed by GitHub Actions (.github/workflows/refresh-pages.yml,
# which runs scripts/build-seo.mjs on GitHub's free minutes). Netlify just
# uploads whatever is in /site.
[build]
  publish = "site"
  # Skip the deploy entirely when a push didn't touch /site or /netlify — docs,
  # workflow edits and bot scripts change nothing users can see, so they
  # shouldn't cost a deploy. Netlify cancels the build when this command exits
  # 0, and `git diff --quiet` exits 0 precisely when both paths are unchanged.
  #
  # /netlify is in the list because the functions ship in the same deploy: with
  # /site alone, a functions-only fix would be silently skipped and the old code
  # would stay live. package.json and its lockfile are here for the same reason
  # — they are what makes Netlify install the functions' dependencies, so a
  # change to them that didn't deploy would be the one change guaranteed to
  # matter.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site netlify package.json package-lock.json"

[functions]
  directory = "netlify/functions"
  # Ship the committed correction seed inside the function bundle. Without this
  # the functions would have to fetch the site's own /data/overrides.json over
  # HTTP to read a file that is already part of the same deploy — a needless
  # round trip that silently drops every correction if the CDN is cold.
  #
  # site/today/** is here for the same reason: today.mjs falls back to the last
  # generated copy of the page when AniList is unreachable, and reads it off
  # disk rather than over HTTP.
  included_files = ["site/data/**", "site/today/**"]

# "What anime is airing today" — rendered per request, not per deploy.
#
# force = true is load-bearing. Netlify serves a matching static file in
# preference to a redirect, and site/today/index.html exists (it is the
# function's offline fallback, shipped via included_files above), so without
# force the static copy wins and the page goes stale again — which is the exact
# bug this route exists to fix. See the header of netlify/functions/today.mjs
# for why a daily rebuild was not an option.
[[redirects]]
  from = "/today"
  to = "/.netlify/functions/today"
  status = 200
  force = true

[[redirects]]
  from = "/today/"
  to = "/.netlify/functions/today"
  status = 200
  force = true

# Friendly aliases for the Web Push API used by site/index.html.
[[redirects]]
  from = "/api/push/subscribe"
  to = "/.netlify/functions/push-subscribe"
  status = 200

[[redirects]]
  from = "/api/push/unsubscribe"
  to = "/.netlify/functions/push-unsubscribe"
  status = 200

# Read-only status for the ingestion backbone's scheduled worker (ingest.mjs).
[[redirects]]
  from = "/api/ingest/status"
  to = "/.netlify/functions/ingest-status"
  status = 200

# Release-schedule corrections: GET is public (every client layers this over
# AniList), POST is maintainer-only. Lets a wrong air time be fixed without
# spending a deploy — see netlify/functions/overrides.mjs.
[[redirects]]
  from = "/api/overrides"
  to = "/.netlify/functions/overrides"
  status = 200

# "This time is wrong" intake from the show modal.
[[redirects]]
  from = "/api/report"
  to = "/.netlify/functions/report"
  status = 200

# Discord sign-in. Identity only — it exists so a skin granted in /admin can
# find the account it was granted to. /api/auth/callback is the URI that has to
# be registered on the Discord application.
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth"
  status = 200

# The skin catalog: public to read (the client applies it), maintainer-only to
# write. Like /api/overrides, a change here reaches everyone without a deploy.
[[redirects]]
  from = "/api/themes"
  to = "/.netlify/functions/themes"
  status = 200

# Which account has which skin. Maintainer-only in both directions.
[[redirects]]
  from = "/api/grants"
  to = "/.netlify/functions/grants"
  status = 200

# Tung Tungs: the balance, the owned skins, the daily wheel and the daily tasks.
# Signed-in only, and the one place in this product where user state is
# server-side rather than local — see netlify/functions/_lib/economy.mjs for why.
# The splat carries the action (/spin, /claim, /buy, /wear) through to the
# function, which reads it off the path.
[[redirects]]
  from = "/api/wallet"
  to = "/.netlify/functions/wallet"
  status = 200

[[redirects]]
  from = "/api/wallet/*"
  to = "/.netlify/functions/wallet"
  status = 200

# Grounded anime chat (SSE). Answers from the corrected schedule via tool calls,
# and falls back to Google Search for anything the calendar doesn't hold — see
# netlify/functions/chat.mjs. Needs GEMINI_API_KEY in the site environment.
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# Public read API. Declared after the specific /api/* routes above so those keep
# winning — Netlify takes the first matching rule, and a splat here would
# otherwise swallow them. /api/ itself stays a static file (the docs page).
[[redirects]]
  from = "/api/v1"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The application, split out of index.html in Aug 2026 (529KB of it). It carries
# no version in its URL, so it cannot be cached immutably — but it also no longer
# changes when the version stamp does, which is the point: a commit that only
# bumps APP_VERSION rewrites index.html alone, and every returning visitor
# revalidates app.js to a 304 instead of re-downloading half a megabyte. The
# service worker is network-first for .js, so a deploy still reaches installs.
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The committed override seed is a correction layer — it must not sit in a CDN
# cache for a day after a fix ships.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

# Subscribable calendar feeds must be served as text/calendar (nosniff is on,
# so the Content-Type has to be correct for calendar apps to accept them).
[[headers]]
  for = "/feeds/*"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Cache-Control = "public, max-age=3600"
