name: Refresh SEO pages & events

# Regenerates the static SEO landing pages (/today/, /<season>-<year>/) +
# sitemap.xml from AniList, AND the Events page data (site/events.json, scraped
# from AnimeCons.com), then commits them. The work here runs on GitHub Actions'
# own free minutes (unlimited on a public repo) — but the commit it pushes
# triggers a Netlify deploy, and THAT is metered.
#
# COST: ~15 Netlify credits per deploy, 300 credits/month on the free tier
# => a hard ceiling of ~20 deploys/month across the WHOLE site, shared with
# feature ships and hotfixes. Deploys bill per push, not per commit.
#
# Hence weekly, not hourly: this job is for Google's crawler, and the app
# itself reads AniList live client-side, so real users see fresh data
# regardless of how often this runs. Raising the frequency here spends the
# budget you need for shipping features.

on:
  schedule:
    - cron: "30 8 * * 1" # 08:30 UTC Mondays (~4-5 deploys/month)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
      - name: Generate SEO pages
        run: node scripts/build-seo.mjs
      - name: Refresh events (scrape AnimeCons.com)
        run: node scripts/build-events.mjs
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "No changes — nothing to deploy."
          else
            # NO [skip ci] HERE, on purpose. Netlify's default "ignore builds"
            # setting skips any build whose commit message contains that string,
            # so stamping it would leave the freshly generated pages committed
            # but never published — which is the whole job of this workflow. The
            # push is meant to deploy; the cost is already budgeted above.
            #
            # It also does not loop: this workflow runs on a schedule and on
            # workflow_dispatch only, never on push, and the CI workflow it
            # re-triggers (tests.yml) is a pure-logic test job that commits
            # nothing back.
            git commit -m "chore: refresh SEO pages and events"
            git push
            echo "Committed refreshed pages; Netlify will deploy them."
          fi
